{% extends "base.html" %}

{% block content %}

<div class="auth-page-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h2>Welcome Back</h2>
            <p>Sign in to manage your tasks and productivity</p>
        </div>

        <form method="POST" action="/login" class="auth-form">
            <!-- Email Field -->
            <div class="form-group">
                <label for="email">
                    <i class="fa-solid fa-envelope"></i> Email Address
                </label>
                <div class="input-with-icon">
                    <input type="email" 
                           id="email" 
                           name="email" 
                           class="form-control" 
                           placeholder="name@example.com" 
                           required>
                </div>
            </div>

            <!-- Password Field with Show/Hide Toggle -->
            <div class="form-group">
                <label for="login-password">
                    <i class="fa-solid fa-lock"></i> Password
                </label>
                <div class="input-password-wrapper">
                    <input type="password" 
                           id="login-password" 
                           name="password" 
                           class="form-control" 
                           placeholder="Enter your password" 
                           required>
                    <button type="button" 
                            class="password-toggle-btn" 
                            onclick="togglePasswordVisibility('login-password', 'login-eye')" 
                            aria-label="Toggle Password Visibility">
                        <i class="fa-solid fa-eye" id="login-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Options Row: Remember Me & Forgot Password -->
            <div class="auth-options-row">
                <label class="remember-me-label">
                    <input type="checkbox" name="remember_me"> Remember Me
                </label>
                <a href="#" class="forgot-password-link" onclick="alert('Forgot password functionality: Please contact administrator.'); return false;">
                    Forgot Password?
                </a>
            </div>

            <!-- Submit Login Button -->
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>

            <!-- Register Link -->
            <div class="auth-footer-link">
                <p>Don't have an account? <a href="/register">Register here</a></p>
            </div>
        </form>
    </div>
</div>

{% endblock %}
