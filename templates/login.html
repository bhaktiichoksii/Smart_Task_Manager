{% extends "base.html" %}
{% block content %}

<h1>Login</h1>
<form method="POST">
    <label>Email</label>
    <input type="email" name="email"><br><br>

    <label>Password</label>
    <input type="password" name="password"><br><br>

    <button type="submit">Login</button>

    <p>
    Don't have an account?
    <a href="/register">Register</a>
</p>
</form>

{% endblock %}
