{% extends "base.html" %}

{% block content %}

<div class="form-page-wrapper">
    <div class="form-card">
        <div class="form-header">
            <div class="form-header-icon icon-edit">
                <i class="fa-solid fa-pen-to-square"></i>
            </div>
            <h2>Edit Task</h2>
            <p>Update existing task details and status</p>
        </div>

        <form method="POST" action="/edit_task/{{ task.id }}" class="task-form">
            <!-- Task Title Field -->
            <div class="form-group">
                <label for="title">
                    <i class="fa-solid fa-heading"></i> Task Title <span class="required-star">*</span>
                </label>
                <input type="text" 
                       id="title" 
                       name="title" 
                       class="form-control" 
                       value="{{ task.title }}" 
                       required>
            </div>

            <!-- Task Description Field -->
            <div class="form-group">
                <label for="description">
                    <i class="fa-solid fa-align-left"></i> Description
                </label>
                <textarea id="description" 
                          name="description" 
                          class="form-control textarea-control" 
                          rows="4">{{ task.description if task.description else "" }}</textarea>
            </div>

            <!-- Task Status Field -->
            <div class="form-group">
                <label for="status">
                    <i class="fa-solid fa-list-check"></i> Status
                </label>
                <select id="status" name="status" class="form-control select-control">
                    <option value="Pending" {% if task.status == "Pending" %}selected{% endif %}>
                        Pending
                    </option>
                    <option value="Completed" {% if task.status == "Completed" %}selected{% endif %}>
                        Completed
                    </option>
                </select>
            </div>

            <!-- Form Action Buttons -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-rotate"></i> Update Task
                </button>
                <a href="/dashboard" class="btn btn-outline">
                    <i class="fa-solid fa-xmark"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
